<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACERVO - Gestão Documental</title>
    
    <!-- Fontes e Scripts -->
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700&family=Space+Mono&display=swap" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    
    <style>
        /* Layout Blueprint Original Restaurado */
        body {
            margin: 0;
            padding: 0;
            background-color: #F6F4EE;
            background-image: radial-gradient(#D8DEE8 1px, transparent 1px);
            background-size: 20px 20px;
            font-family: 'Barlow Condensed', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #1C1B18;
        }
        .container {
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid #1C1B18;
            padding: 60px;
            text-align: center;
            box-shadow: 10px 10px 0px #D8DEE8;
            position: relative;
            max-width: 400px;
        }
        .container::before {
            content: "";
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            border: 1px solid #2B4C7E;
            pointer-events: none;
            opacity: 0.3;
        }
        h1 {
            font-size: 4rem;
            margin: 0;
            letter-spacing: 5px;
            text-transform: uppercase;
            font-weight: 700;
        }
        p {
            font-family: 'Space Mono', monospace;
            font-size: 0.9rem;
            margin-bottom: 40px;
            color: #2B4C7E;
            text-transform: uppercase;
        }
        #login-container {
            display: flex;
            justify-content: center;
            min-height: 40px;
        }
        .footer-note {
            margin-top: 50px;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.5;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>ACERVO</h1>
        <p>SISTEMA DE GESTÃO DOCUMENTAL</p>
        
        <div id="login-container">
            <!-- O botão do Google será renderizado aqui -->
            <div id="buttonDiv"></div>
        </div>

        <div class="footer-note">Acesso restrito / Protocolo de Segurança</div>
    </div>

    <script>
        // Configurações do Projeto
        const GOOGLE_CLIENT_ID = '1032170606542-dukbmb70h332gpjtbuncl76bvobv6dvi.apps.googleusercontent.com';
        
        const firebaseConfig = {
            apiKey: "AIzaSyBKDvELUvYH1TESB7M_JjojW4nxUpf6cgQ",
            authDomain: "acervo-15e48.firebaseapp.com",
            projectId: "acervo-15e48",
            storageBucket: "acervo-15e48.firebasestorage.app",
            messagingSenderId: "1032170606542",
            appId: "1:1032170606542:web:d8cca054a21a3b52dce59f"
        };

        // Inicializa Firebase
        firebase.initializeApp(firebaseConfig);

        // Processa o retorno do login
        function handleCredentialResponse(response) {
            const credential = firebase.auth.GoogleAuthProvider.credential(response.credential);
            firebase.auth().signInWithCredential(credential)
                .then((result) => {
                    console.log("Login realizado:", result.user.email);
                    // O sistema principal deve estar em outro arquivo ou ser carregado aqui
                })
                .catch((error) => {
                    console.error("Erro no login:", error);
                    alert("Falha na autenticação: " + error.message);
                });
        }

        // Renderiza o botão ao carregar a página
        window.onload = function () {
            if (typeof google !== 'undefined') {
                google.accounts.id.initialize({
                    client_id: GOOGLE_CLIENT_ID,
                    callback: handleCredentialResponse
                });
                google.accounts.id.renderButton(
                    document.getElementById("buttonDiv"),
                    { theme: "outline", size: "large", text: "signin_with", shape: "rectangular" }
                );
            } else {
                console.error("Script do Google não carregado.");
            }
        };
    </script>
</body>
</html>
