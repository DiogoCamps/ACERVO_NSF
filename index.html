<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACERVO JURÍDICO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#12141A;
  --panel:#1A1E28;
  --panel-2:#20252F;
  --line:#2A3140;
  --line-soft:#232936;
  --txt:#E8EAF0;
  --txt-dim:#9AA3B2;
  --txt-faint:#6B7484;
  --amber:#E8A33D;
  --amber-dim:rgba(232,163,61,.14);
  --red:#E11D2E; --blue:#1D4ED8; --green:#059669; --orange:#EA580C; --purple:#7C3AED;
  --mono:'IBM Plex Mono',monospace;
  --disp:'Saira Condensed',sans-serif;
  --body:'Archivo',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--bg);
  color:var(--txt);
  font-family:var(--body);
  min-height:100vh;
  background-image:
    linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.015) 1px,transparent 1px);
  background-size:48px 48px;
}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}

/* ===== TOP BAR ===== */
.topbar{
  border-bottom:1px solid var(--line);
  background:rgba(18,20,26,.92);
  position:sticky;top:0;z-index:50;
  backdrop-filter:blur(6px);
}
.topbar-inner{display:flex;align-items:center;gap:20px;height:56px}
.logo{
  font-family:var(--disp);font-weight:700;font-size:20px;
  letter-spacing:.14em;text-transform:uppercase;
  padding:4px 14px;border:1px solid var(--line);
  background:var(--panel);position:relative;
}
.logo::before{content:'';position:absolute;left:6px;top:50%;transform:translateY(-50%);
  width:5px;height:5px;border-radius:50%;background:var(--amber)}
.logo{padding-left:20px}
.crumb{font-family:var(--mono);font-size:12px;color:var(--txt-dim);letter-spacing:.04em}
.crumb b{color:var(--amber);font-weight:500}
.topbar-right{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--txt-faint)}

/* ===== HERO SEARCH ===== */
.hero{padding:48px 0 8px;text-align:center}
.hero h1{
  font-family:var(--disp);font-weight:600;font-size:15px;
  letter-spacing:.3em;text-transform:uppercase;color:var(--txt-dim);margin-bottom:20px;
}
.search-shell{max-width:680px;margin:0 auto;position:relative}
.search-shell::before,.search-shell::after{
  content:'';position:absolute;top:50%;width:60px;height:1px;background:var(--line);
}
.search-shell::before{left:-80px}
.search-shell::after{right:-80px}
#busca{
  width:100%;padding:16px 20px;font-family:var(--mono);font-size:15px;
  background:var(--panel);border:1px solid var(--line);color:var(--txt);
  outline:none;transition:border-color .2s,box-shadow .2s;
}
#busca::placeholder{color:var(--txt-faint)}
#busca:focus{border-color:var(--amber);box-shadow:0 0 0 3px var(--amber-dim)}
.resultados{max-width:680px;margin:16px auto 0;text-align:left}
.ficha{
  background:var(--panel);border:1px solid var(--line);
  border-left:3px solid var(--amber);
  padding:14px 18px;margin-bottom:8px;
  display:flex;align-items:center;gap:16px;
  animation:slideIn .25s ease both;
}
@keyframes slideIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ficha-nome{font-family:var(--disp);font-weight:600;font-size:17px;letter-spacing:.02em;text-transform:uppercase}
.ficha-loc{font-family:var(--mono);font-size:12px;color:var(--txt-dim);margin-top:3px}
.ficha-btn{
  margin-left:auto;flex-shrink:0;
  font-family:var(--mono);font-size:11px;letter-spacing:.1em;
  background:var(--amber);color:#12141A;border:none;
  padding:8px 16px;cursor:pointer;font-weight:500;transition:filter .15s;
}
.ficha-btn:hover{filter:brightness(1.1)}
.ficha-btn:active{filter:brightness(.9)}
.msg-busca{font-family:var(--mono);font-size:12px;color:var(--txt-faint);padding:12px 4px}
.msg-busca.erro{color:#E05252}

/* ===== STAT STRIP ===== */
.stats{
  display:flex;justify-content:center;gap:0;
  margin:40px auto 0;max-width:860px;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);
}
.stat{
  flex:1;padding:20px 12px;text-align:center;
  border-left:1px solid var(--line);
}
.stat:first-child{border-left:none}
.stat-num{font-family:var(--mono);font-size:26px;font-weight:500;color:var(--txt)}
.stat-lbl{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--txt-faint);text-transform:uppercase;margin-top:6px}

/* ===== ESTANTES ===== */
.secao-titulo{
  font-family:var(--disp);font-weight:600;font-size:14px;
  letter-spacing:.28em;text-transform:uppercase;color:var(--txt-dim);
  margin:56px 0 20px;display:flex;align-items:center;gap:16px;
}
.secao-titulo::after{content:'';flex:1;height:1px;background:var(--line)}
.grid-estantes{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.gaveta{
  background:var(--panel);border:1px solid var(--line);
  padding:18px 16px 14px;cursor:pointer;position:relative;
  transition:border-color .2s,transform .15s;
  animation:slideIn .4s ease both;
}
.gaveta:hover{border-color:rgba(232,163,61,.45);transform:translateY(-2px)}
.gaveta::after{
  content:'';position:absolute;left:20%;right:20%;bottom:8px;height:3px;
  background:var(--line-soft);border-radius:2px;
}
.gaveta-tag{
  display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.12em;
  padding:3px 8px;color:#fff;text-transform:uppercase;margin-bottom:10px;
}
.gaveta-nome{font-family:var(--disp);font-weight:600;font-size:18px;letter-spacing:.03em;text-transform:uppercase}
.gaveta-count{font-family:var(--mono);font-size:11px;color:var(--txt-dim);margin-top:8px}

/* ===== PAINEL CAIXAS ===== */
.painel{
  background:var(--panel);border:1px solid var(--line);
  margin-top:14px;padding:20px;display:none;
}
.painel.aberto{display:block;animation:slideIn .25s ease}
.painel h3{
  font-family:var(--disp);font-weight:600;font-size:15px;letter-spacing:.1em;
  text-transform:uppercase;margin-bottom:14px;color:var(--txt-dim);
}
.caixa-item{
  display:flex;align-items:center;gap:14px;
  padding:10px 14px;border:1px solid var(--line-soft);
  margin-bottom:6px;cursor:pointer;background:var(--panel-2);
  transition:border-color .15s;
}
.caixa-item:hover{border-color:rgba(232,163,61,.4)}
.caixa-cod{font-family:var(--mono);font-size:13px;font-weight:500}
.caixa-n{font-family:var(--mono);font-size:11px;color:var(--txt-faint);margin-left:auto}
.doc-item{
  padding:10px 14px;border-bottom:1px solid var(--line-soft);
  display:flex;gap:14px;align-items:baseline;
}
.doc-item:last-child{border-bottom:none}
.doc-nome{font-size:14px;font-weight:500}
.doc-meta{font-family:var(--mono);font-size:11px;color:var(--txt-faint);margin-left:auto;flex-shrink:0}
.voltar{
  font-family:var(--mono);font-size:11px;letter-spacing:.1em;
  color:var(--amber);background:none;border:1px solid var(--line);
  padding:6px 14px;cursor:pointer;margin-bottom:14px;text-transform:uppercase;
}
.voltar:hover{border-color:var(--amber)}

/* flash de destaque */
@keyframes flash{
  0%,100%{box-shadow:none}
  30%{box-shadow:0 0 0 3px var(--amber)}
}
.flash{animation:flash 1.2s ease 2}

/* skeleton */
.skel{
  height:90px;background:linear-gradient(90deg,var(--panel) 25%,var(--panel-2) 50%,var(--panel) 75%);
  background-size:200% 100%;animation:shimmer 1.4s infinite;border:1px solid var(--line);
}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}

footer{
  margin-top:64px;padding:20px 0 32px;border-top:1px solid var(--line);
  font-family:var(--mono);font-size:11px;color:var(--txt-faint);text-align:center;
  letter-spacing:.08em;
}

@media(max-width:720px){
  .search-shell::before,.search-shell::after{display:none}
  .stats{flex-wrap:wrap}
  .stat{min-width:45%;border-top:1px solid var(--line)}
  .stat:nth-child(-n+2){border-top:none}
  .stat:nth-child(3){border-left:none}
  .hero{padding-top:32px}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap topbar-inner">
    <div class="logo">ACERVO</div>
    <div class="crumb">SETOR: <b>JURÍDICO</b> // <span id="crumb-total">—</span> REGISTROS</div>
    <div class="topbar-right" id="user-chip"></div>
  </div>
</header>

<main class="wrap">

  <section class="hero">
    <h1>Consulta de Registro</h1>
    <div class="search-shell">
      <input id="busca" type="text" placeholder="CONSULTAR REGISTRO — digite o nome..." autocomplete="off" aria-label="Buscar documento por nome">
    </div>
    <div class="resultados" id="resultados"></div>
  </section>

  <section class="stats" id="stats">
    <div class="stat"><div class="stat-num skel-num" style="height:26px;width:80px;margin:0 auto;background:var(--panel-2)"></div><div class="stat-lbl">Documentos</div></div>
    <div class="stat"><div class="stat-num skel-num" style="height:26px;width:80px;margin:0 auto;background:var(--panel-2)"></div><div class="stat-lbl">Caixas</div></div>
    <div class="stat"><div class="stat-num skel-num" style="height:26px;width:80px;margin:0 auto;background:var(--panel-2)"></div><div class="stat-lbl">Na lixeira</div></div>
    <div class="stat"><div class="stat-num skel-num" style="height:26px;width:80px;margin:0 auto;background:var(--panel-2)"></div><div class="stat-lbl">Estantes</div></div>
  </section>

  <section>
    <div class="secao-titulo">Estantes</div>
    <div class="grid-estantes" id="grid-estantes">
      <div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div>
    </div>
    <div class="painel" id="painel"></div>
  </section>

</main>

<footer>ACERVO JURÍDICO — SISTEMA DE GESTÃO DE ACERVO FÍSICO DIGITALIZADO</footer>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAONXkMDXTBrw6lLxkThNLzm3YbbNZbf8I",
  authDomain: "acervo-dffd3.firebaseapp.com",
  projectId: "acervo-dffd3",
  storageBucket: "acervo-dffd3.firebasestorage.app",
  messagingSenderId: "261689105724",
  appId: "1:261689105724:web:a3a4e4c8863c28bef2d239"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const CORES = {
  'ARMARIO':'#E11D2E','ARMÁRIO':'#E11D2E',
  'A':'#1D4ED8','B':'#059669','C':'#EA580C','D':'#7C3AED'
};
function corDe(nome){
  const n = (nome||'').toUpperCase();
  if(n.indexOf('ARMAR') >= 0) return CORES['ARMARIO'];
  const m = n.match(/([A-D])\s*$/);
  return (m && CORES[m[1]]) ? CORES[m[1]] : '#E8A33D';
}
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function normalizar(s){ return (s==null?'':String(s)).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim(); }

let docs = [];        // cache de todos os documentos
let estantes = [];    // cache de estantes
let estanteAberta = null;
let caixaAberta = null;

async function carregar(){
  try{
    const [snapDocs, snapEst] = await Promise.all([
      db.collection('documentos').get(),
      db.collection('estantes').get()
    ]);
    docs = [];
    snapDocs.forEach(d => docs.push(d.data()));
    estantes = [];
    snapEst.forEach(d => estantes.push(Object.assign({id:d.id}, d.data())));

    renderStats();
    renderEstantes();
  }catch(err){
    document.getElementById('grid-estantes').innerHTML =
      '<div class="msg-busca erro">Erro ao carregar dados: ' + esc(err.message) + '</div>';
  }
}

function ativos(){ return docs.filter(d => !d.excluidoEm); }
function naLixeira(){ return docs.filter(d => d.excluidoEm); }

function renderStats(){
  const a = ativos();
  const caixas = new Set(a.map(d => (d.estante||'') + '|' + (d.caixa||'')).filter(x => x !== '|'));
  const nums = document.querySelectorAll('#stats .stat-num');
  nums[0].textContent = a.length.toLocaleString('pt-BR');
  nums[1].textContent = caixas.size;
  nums[2].textContent = naLixeira().length;
  nums[3].textContent = estantes.length;
  nums[0].style.cssText = nums[1].style.cssText = nums[2].style.cssText = nums[3].style.cssText = '';
  document.getElementById('crumb-total').textContent = a.length.toLocaleString('pt-BR');
}

function renderEstantes(){
  const grid = document.getElementById('grid-estantes');
  const a = ativos();
  grid.innerHTML = estantes.map((e,i) => {
    const nome = e.nome || e.id;
    const meus = a.filter(d => (d.estante||'').toUpperCase() === nome.toUpperCase());
    const cx = new Set(meus.map(d => d.caixa).filter(Boolean));
    return '<div class="gaveta" data-estante="' + esc(nome) + '" style="animation-delay:' + (i*60) + 'ms" tabindex="0" role="button" aria-label="Abrir estante ' + esc(nome) + '">' +
      '<span class="gaveta-tag" style="background:' + corDe(nome) + '">' + esc(nome) + '</span>' +
      '<div class="gaveta-nome">' + esc(nome) + '</div>' +
      '<div class="gaveta-count">' + cx.size + ' CAIXAS · ' + meus.length + ' DOCS</div>' +
      '</div>';
  }).join('');
  grid.querySelectorAll('.gaveta').forEach(g => {
    const abrir = () => abrirEstante(g.dataset.estante, g);
    g.addEventListener('click', abrir);
    g.addEventListener('keydown', ev => { if(ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); abrir(); } });
  });
}

function abrirEstante(nome, elRef){
  estanteAberta = nome; caixaAberta = null;
  renderPainel();
  const painel = document.getElementById('painel');
  painel.classList.add('aberto');
  painel.scrollIntoView({behavior:'smooth', block:'nearest'});
}

function renderPainel(){
  const painel = document.getElementById('painel');
  const a = ativos().filter(d => (d.estante||'').toUpperCase() === (estanteAberta||'').toUpperCase());
  if(!caixaAberta){
    const mapa = {};
    a.forEach(d => { if(d.caixa){ (mapa[d.caixa] = mapa[d.caixa] || []).push(d); } });
    const cods = Object.keys(mapa).sort((x,y) => String(x).localeCompare(String(y), undefined, {numeric:true}));
    painel.innerHTML =
      '<button class="voltar" onclick="fecharPainel()">Fechar</button>' +
      '<h3>' + esc(estanteAberta) + ' — Caixas</h3>' +
      cods.map(c =>
        '<div class="caixa-item" data-caixa="' + esc(c) + '" tabindex="0" role="button">' +
        '<span class="caixa-cod">' + esc(c) + '</span>' +
        '<span class="caixa-n">' + mapa[c].length + ' DOCS</span></div>'
      ).join('') +
      (cods.length === 0 ? '<div class="msg-busca">Nenhuma caixa nesta estante.</div>' : '');
    painel.querySelectorAll('.caixa-item').forEach(ci => {
      const abrir = () => { caixaAberta = ci.dataset.caixa; renderPainel(); };
      ci.addEventListener('click', abrir);
      ci.addEventListener('keydown', ev => { if(ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); abrir(); } });
    });
  } else {
    const lista = a.filter(d => d.caixa === caixaAberta)
      .sort((x,y) => String(x.nome||'').localeCompare(String(y.nome||'')));
    painel.innerHTML =
      '<button class="voltar" onclick="caixaAberta=null;renderPainel()">Voltar às caixas</button>' +
      '<h3>' + esc(estanteAberta) + ' · ' + esc(caixaAberta) + '</h3>' +
      lista.map(d =>
        '<div class="doc-item">' +
        '<span class="doc-nome">' + esc(d.nome || '(sem nome)') + '</span>' +
        '<span class="doc-meta">' + esc(d.tipo || '') + (d.data ? ' · ' + esc(d.data) : '') + '</span>' +
        '</div>'
      ).join('') +
      (lista.length === 0 ? '<div class="msg-busca">Nenhum documento nesta caixa.</div>' : '');
  }
}

function fecharPainel(){
  estanteAberta = null; caixaAberta = null;
  document.getElementById('painel').classList.remove('aberto');
}

/* ===== BUSCA ===== */
const input = document.getElementById('busca');
const box = document.getElementById('resultados');
let timer = null;
input.addEventListener('input', () => {
  clearTimeout(timer);
  timer = setTimeout(buscar, 250);
});

function buscar(){
  const termo = normalizar(input.value);
  box.innerHTML = '';
  if(termo.length < 3) return;
  const a = ativos();
  const achados = a.filter(d => {
    const alvo = normalizar(d.nomeBusca || d.nome || '');
    return alvo.indexOf(termo) >= 0;
  });
  if(achados.length === 0){
    box.innerHTML = '<div class="msg-busca">Nenhum registro encontrado para "' + esc(input.value) + '".</div>';
    return;
  }
  box.innerHTML = achados.slice(0,20).map((f,i) =>
    '<div class="ficha" style="animation-delay:' + (i*40) + 'ms">' +
    '<div><div class="ficha-nome">' + esc(f.nome || '') + '</div>' +
    '<div class="ficha-loc">' + esc((f.estante||'?').toUpperCase()) + ' · CAIXA ' + esc(f.caixa||'?') + '</div></div>' +
    '<button class="ficha-btn" data-estante="' + esc(f.estante||'') + '">LOCALIZAR</button>' +
    '</div>'
  ).join('') +
  (achados.length > 20 ? '<div class="msg-busca">+ ' + (achados.length-20) + ' resultados — refine a busca.</div>' : '');
  box.querySelectorAll('.ficha-btn').forEach(b => {
    b.addEventListener('click', () => localizar(b.dataset.estante));
  });
}

function localizar(nomeEstante){
  fecharPainel();
  const g = document.querySelector('.gaveta[data-estante="' + CSS.escape(nomeEstante) + '"]');
  if(!g) return;
  g.scrollIntoView({behavior:'smooth', block:'center'});
  g.classList.add('flash');
  setTimeout(() => g.classList.remove('flash'), 2600);
}

carregar();
</script>
</body>
</html>
