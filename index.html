<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACERVO - Gestão Documental</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700&family=Space+Mono&display=swap" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    
    <style>
        /* Layout Blueprint Original */
        body {
            margin: 0; padding: 0;
            background-color: #F6F4EE;
            background-image: radial-gradient(#D8DEE8 1px, transparent 1px);
            background-size: 20px 20px;
            font-family: 'Barlow Condensed', sans-serif;
            color: #1C1B18;
        }

        /* Tela de Login */
        #tela-login {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: fixed;
            width: 100%;
            z-index: 1000;
            background-color: #F6F4EE;
        }

        .container-login {
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid #1C1B18;
            padding: 60px;
            text-align: center;
            box-shadow: 10px 10px 0px #D8DEE8;
        }

        /* Área do Sistema (Escondida até o login) */
        #sistema-principal {
            display: none;
            padding: 20px;
        }

        h1 { font-size: 3rem; margin: 0; letter-spacing: 5px; text-transform: uppercase; }
        p.subtitle { font-family: 'Space Mono', monospace; font-size: 0.8rem; color: #2B4C7E; margin-bottom: 30px; }
    </style>
</head>
<body>

    <!-- TELA DE LOGIN -->
    <div id="tela-login">
        <div class="container-login">
            <h1>ACERVO</h1>
            <p class="subtitle">SISTEMA DE GESTÃO DOCUMENTAL</p>
            <div id="buttonDiv"></div>
            <p id="msg-status" style="margin-top: 20px; font-size: 12px; color: #666;">Aguardando autenticação...</p>
        </div>
    </div>

    <!-- SISTEMA PRINCIPAL (Seu front original entra aqui) -->
    <div id="sistema-principal">
        <div style="border: 2px dashed #2B4C7E; padding: 20px; text-align: center;">
            <h2 style="color: #2B4C7E;">ACESSO AUTORIZADO</h2>
            <p>Bem-vindo ao sistema de estantes e caixas.</p>
            <!-- O restante do seu front de gestão documental deve ser colado aqui dentro -->
        </div>
    </div>

    <script>
        const GOOGLE_CLIENT_ID = '1032170606542-dukbmb70h332gpjtbuncl76bvobv6dvi.apps.googleusercontent.com';
        
        const firebaseConfig = {
            apiKey: "AIzaSyBKDvELUvYH1TESB7M_JjojW4nxUpf6cgQ",
            authDomain: "acervo-15e48.firebaseapp.com",
            projectId: "acervo-15e48",
            storageBucket: "acervo-15e48.firebasestorage.app",
            messagingSenderId: "1032170606542",
            appId: "1:1032170606542:web:d8cca054a21a3b52dce59f"
        };

        firebase.initializeApp(firebaseConfig);

        // Função que lida com o sucesso do login
        function handleCredentialResponse(response) {
            document.getElementById('msg-status').innerText = "Validando credenciais...";
            const credential = firebase.auth.GoogleAuthProvider.credential(response.credential);
            
            firebase.auth().signInWithCredential(credential)
                .then((result) => {
                    console.log("Login OK:", result.user.email);
                    // SUCESSO: Esconde login e mostra sistema
                    document.getElementById('tela-login').style.display = 'none';
                    document.getElementById('sistema-principal').style.display = 'block';
                })
                .catch((error) => {
                    console.error("Erro Firebase:", error);
                    document.getElementById('msg-status').innerText = "Erro: " + error.message;
                });
        }

        window.onload = function () {
            google.accounts.id.initialize({
                client_id: GOOGLE_CLIENT_ID,
                callback: handleCredentialResponse,
                ux_mode: 'popup' // Se o erro de COOP persistir, mudaremos para 'redirect'
            });
            
            google.accounts.id.renderButton(
                document.getElementById("buttonDiv"),
                { theme: "outline", size: "large", width: 250 }
            );

            // Verifica se já está logado
            firebase.auth().onAuthStateChanged((user) => {
                if (user) {
                    document.getElementById('tela-login').style.display = 'none';
                    document.getElementById('sistema-principal').style.display = 'block';
                }
            });
        };
    </script>
</body>
</html>
